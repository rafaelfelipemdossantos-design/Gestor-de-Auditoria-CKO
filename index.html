<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="CKO Pro">
    <link rel="apple-touch-icon" href="logo.png">
    <title>Auditoria CKO Pro</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Fontes e Ícones -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f1f5f9; 
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior-y: contain;
        }
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); }
        input:focus, select:focus { outline: 2px solid #4f46e5; outline-offset: 1px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Estilo para PWA e Safe Areas */
        header { 
            padding-top: max(1.5rem, env(safe-area-inset-top));
            padding-bottom: 1.5rem;
        }
        
        /* Ajuste de inputs para não dar zoom no iOS */
        input[type="text"], input[type="number"], select {
            font-size: 16px !important;
        }

        /* Melhorias no Modal para Mobile */
        #auditModal > div {
            padding-bottom: max(2rem, env(safe-area-inset-bottom));
        }

        .active-scale:active {
            transform: scale(0.98);
            transition: transform 0.1s;
        }
    </style>
</head>
<body class="pb-20">

    <!-- Header com Logo SVG -->
    <header class="bg-slate-900 text-white px-6 sticky top-0 z-50 shadow-md">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 w-full md:w-auto justify-center md:justify-start">
                <!-- Logo Criado em SVG -->
                <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-lg">
                    <rect width="100" height="100" rx="22" fill="#4f46e5"/>
                    <path d="M30 50L45 65L75 35" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                    <rect x="25" y="25" width="50" height="50" rx="4" stroke="white" stroke-width="3" stroke-dasharray="4 4" opacity="0.5"/>
                </svg>
                <div>
                    <h1 class="text-2xl font-black tracking-tight leading-none">AUDITORIA <span class="text-indigo-400">CKO</span></h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">Smart Management System</p>
                </div>
            </div>
            <div class="flex gap-2 w-full md:w-auto">
                <button onclick="confirmReset()" class="active-scale flex-1 md:flex-none bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white p-3 rounded-xl transition-all font-bold text-xs border border-red-500/20 flex items-center justify-center gap-2">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Resetar
                </button>
                <button onclick="exportToExcel()" class="active-scale flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 p-3 rounded-xl flex items-center justify-center gap-2 transition-all font-bold text-xs text-white">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Exportar CSV
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 space-y-6">
        
        <!-- Dashboard Rápido -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 card-shadow">
                <div class="flex items-center justify-between mb-1">
                    <p class="text-[10px] text-slate-500 uppercase font-black">Lojas</p>
                    <i data-lucide="home" class="w-3 h-3 text-slate-400"></i>
                </div>
                <p id="statTotal" class="text-2xl font-black text-slate-800">0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 card-shadow">
                <div class="flex items-center justify-between mb-1">
                    <p class="text-[10px] text-amber-500 uppercase font-black">Faltando</p>
                    <i data-lucide="clock" class="w-3 h-3 text-amber-400"></i>
                </div>
                <p id="statPendente" class="text-2xl font-black text-amber-600">0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 card-shadow">
                <div class="flex items-center justify-between mb-1">
                    <p class="text-[10px] text-emerald-500 uppercase font-black">Pronto</p>
                    <i data-lucide="check-circle" class="w-3 h-3 text-emerald-400"></i>
                </div>
                <p id="statResolvido" class="text-2xl font-black text-emerald-600">0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 card-shadow">
                <div class="flex items-center justify-between mb-1">
                    <p class="text-[10px] text-indigo-500 uppercase font-black">Divergência</p>
                    <i data-lucide="alert-triangle" class="w-3 h-3 text-indigo-400"></i>
                </div>
                <p id="statRegistros" class="text-2xl font-black text-indigo-600">0</p>
            </div>
        </div>

        <!-- Filtros -->
        <div class="relative">
            <i data-lucide="search" class="absolute left-4 top-4 text-slate-400 w-5 h-5"></i>
            <input type="text" id="searchInput" placeholder="Buscar unidade ou colaborador..." 
                class="w-full pl-12 pr-4 py-4 rounded-2xl border-none card-shadow outline-none text-slate-700 font-medium"
                oninput="filterStores()">
        </div>

        <!-- Lista -->
        <div id="storeList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </main>

    <!-- Modal Form -->
    <div id="auditModal" class="fixed inset-0 bg-slate-900/60 hidden z-[60] flex items-end md:items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-full max-w-xl rounded-t-[32px] md:rounded-[32px] p-6 shadow-2xl overflow-y-auto max-h-[95vh] no-scrollbar">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 md:hidden"></div>
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h2 id="modalTitle" class="text-xl font-black text-slate-800 uppercase leading-tight"></h2>
                    <p id="modalSubtitle" class="text-xs text-slate-500 font-mono mt-1"></p>
                </div>
                <button onclick="toggleModal('auditModal')" class="bg-slate-100 p-2 rounded-full text-slate-400 active-scale">
                    <i data-lucide="x"></i>
                </button>
            </div>
            
            <form id="auditForm" class="space-y-5">
                <input type="hidden" id="currentStoreId">
                
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-500 uppercase ml-1">Colaborador</label>
                    <input type="text" id="editColab" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold uppercase">
                </div>

                <div class="bg-indigo-50 p-5 rounded-[24px] space-y-4">
                    <h3 class="text-[10px] font-black text-indigo-600 uppercase flex items-center gap-2">
                        <i data-lucide="package" class="w-4 h-4"></i> Contagem Física CKO
                    </h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-indigo-600 uppercase ml-1">Regular</label>
                            <input type="number" id="ckoRegular" required placeholder="0" class="w-full p-4 bg-white border border-indigo-100 rounded-xl font-black text-center text-xl" oninput="calculateTotalCKO()">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-indigo-600 uppercase ml-1">Papa Fila</label>
                            <input type="number" id="ckoPapafila" required placeholder="0" class="w-full p-4 bg-white border border-indigo-100 rounded-xl font-black text-center text-xl" oninput="calculateTotalCKO()">
                        </div>
                    </div>
                    <div class="flex justify-between items-center px-2">
                         <div class="space-y-1 w-full">
                            <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Informativo CNPJ</label>
                            <input type="number" id="ckoCnpj" required placeholder="0" class="w-full p-3 bg-white/50 border border-slate-200 rounded-xl font-bold text-center">
                        </div>
                    </div>
                    <div class="bg-indigo-600 p-4 rounded-2xl flex justify-between items-center text-white shadow-lg shadow-indigo-100">
                        <span class="text-xs font-black uppercase">Total Auditado</span>
                        <span id="displayTotalCKO" class="text-3xl font-black">0</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 uppercase ml-1">RetailX</label>
                        <input type="number" id="retailQty" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-black text-xl text-slate-700">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 uppercase ml-1">Status</label>
                        <select id="auditStatus" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold appearance-none">
                            <option value="Pendente">🟡 Pendente</option>
                            <option value="Resolvido">🟢 Resolvido</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-500 uppercase ml-1">Data de Referência</label>
                    <input type="date" id="requestDate" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-semibold">
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="submit" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black shadow-xl hover:bg-black active-scale transition-all uppercase tracking-wider">
                        Confirmar Auditoria
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modals de Sistema -->
    <div id="resetModal" class="fixed inset-0 bg-slate-900/80 hidden z-[100] flex items-center justify-center p-6 backdrop-blur-md">
        <div class="bg-white w-full max-w-sm rounded-[32px] p-8 text-center shadow-2xl">
            <div class="bg-red-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 text-red-600">
                <i data-lucide="alert-octagon" class="w-10 h-10"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800 uppercase mb-3">Limpar Base?</h2>
            <p class="text-slate-500 text-sm mb-8 leading-relaxed">Isso apagará todos os dados salvos permanentemente. Esta ação não pode ser desfeita.</p>
            <div class="flex flex-col gap-3">
                <button onclick="executeReset()" class="active-scale w-full bg-red-600 text-white py-4 rounded-2xl font-black uppercase">Sim, apagar tudo</button>
                <button onclick="toggleModal('resetModal')" class="active-scale w-full py-4 font-bold text-slate-400">Cancelar</button>
            </div>
        </div>
    </div>

            { id: '0018a000022TUVFAA4', name: 'REDE DROGA LESTE R TIBURCIO DE SOUSA', canal: 'DPP', setor: 'SPC384', colab: 'PAULA NOELY DA SILVA MATOS' },
            { id: '0018a000022TUVMAA4', name: 'SEMAR VILA ROMANOPOLIS', canal: 'NMR', setor: 'SPC376', colab: 'RENATO ANDRE DE MELO RIBEIRO' },
            { id: '0014W00002e9LM7QAM_2', name: 'TENDA FERRAZ DE VASCONCELOS', canal: 'C&C', setor: 'SPC376', colab: 'RENATO ANDRE DE MELO RIBEIRO' },
            { id: '0014W00002e9JBzQAM', name: 'SHIBATA ITAQUAQUECETUBA', canal: 'NMR', setor: 'SP548', colab: 'MARCOS AUGUSTO CUSTODIO DA SILVA' },
            { id: '0014W00002e9LM4QAM', name: 'TENDA SUZANO', canal: 'C&C', setor: 'SP548', colab: 'THAYSSA JOYCE THIAGO' },
            { id: '0014W00002e9LM5QAM_2', name: 'TENDA ITAQUAQUECETUBA', canal: 'C&C', setor: 'SP545', colab: 'VANESSA DA SILVA SANTOS' }
        ];

        let stores = [];
        let audits = {};

        // Inicialização
        window.onload = () => {
            loadData();
            updateStats();
            renderStores();
            lucide.createIcons();
            document.getElementById('requestDate').valueAsDate = new Date();
            
            // Registro do Service Worker para PWA
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            }
        };

        function loadData() {
            const s = localStorage.getItem('aud_stores_final');
            const a = localStorage.getItem('aud_data_final');
            stores = s ? JSON.parse(s) : officialStores;
            audits = a ? JSON.parse(a) : {};
        }

        function saveData() {
            localStorage.setItem('aud_stores_final', JSON.stringify(stores));
            localStorage.setItem('aud_data_final', JSON.stringify(audits));
            updateStats();
        }

        function calculateTotalCKO() {
            const reg = parseInt(document.getElementById('ckoRegular').value) || 0;
            const pf = parseInt(document.getElementById('ckoPapafila').value) || 0;
            const total = reg + pf;
            document.getElementById('displayTotalCKO').innerText = total;
            return total;
        }

        function renderStores(filtered = null) {
            const container = document.getElementById('storeList');
            const data = filtered || stores;
            
            if (data.length === 0) {
                container.innerHTML = `<div class="col-span-full py-20 text-center text-slate-400 font-bold uppercase tracking-widest opacity-30">Nenhum resultado</div>`;
                return;
            }

            container.innerHTML = data.map(store => {
                const audit = audits[store.id];
                const isPendente = !audit || audit.status === 'Pendente';
                
                return `
                    <div onclick="openAudit('${store.id}')" class="bg-white p-5 rounded-[28px] border border-slate-200 card-shadow active-scale cursor-pointer group transition-all">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[9px] font-black bg-slate-100 text-slate-500 px-2 py-1 rounded-md uppercase tracking-tighter">${store.id}</span>
                            <div class="flex items-center gap-1.5">
                                <div class="w-2 h-2 rounded-full ${isPendente ? 'bg-amber-500 animate-pulse' : 'bg-emerald-500'}"></div>
                                <span class="text-[10px] font-black uppercase ${isPendente ? 'text-amber-600' : 'text-emerald-600'}">
                                    ${isPendente ? 'Aguardando Auditoria' : 'Auditado'}
                                </span>
                            </div>
                        </div>
                        <h3 class="font-black text-slate-800 text-lg leading-tight mb-4 group-hover:text-indigo-600 transition-colors uppercase">${store.name}</h3>
                        <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-50">
                            <div>
                                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Responsável</p>
                                <p class="text-[11px] font-bold text-slate-600 uppercase truncate">${store.colab}</p>
                            </div>
                            <div>
                                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Canal / Setor</p>
                                <p class="text-[11px] font-bold text-slate-600 uppercase">${store.canal} | ${store.setor}</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterStores() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = stores.filter(s => 
                s.name.toLowerCase().includes(term) || 
                s.colab.toLowerCase().includes(term) ||
                s.id.toLowerCase().includes(term)
            );
            renderStores(filtered);
        }

        function openAudit(id) {
            const store = stores.find(s => s.id === id);
            const audit = audits[id] || {};
            
            document.getElementById('currentStoreId').value = id;
            document.getElementById('modalTitle').innerText = store.name;
            document.getElementById('modalSubtitle').innerText = `ID: ${id} | ${store.canal} - ${store.setor}`;
            
            document.getElementById('editColab').value = audit.colab || store.colab;
            document.getElementById('ckoRegular').value = audit.ckoRegular || '';
            document.getElementById('ckoPapafila').value = audit.ckoPapafila || '';
            document.getElementById('ckoCnpj').value = audit.ckoCnpj || '';
            document.getElementById('retailQty').value = audit.retailQty || '';
            document.getElementById('auditStatus').value = audit.status || 'Pendente';
            
            if (audit.date) document.getElementById('requestDate').value = audit.date;
            
            calculateTotalCKO();
            toggleModal('auditModal');
        }

        document.getElementById('auditForm').onsubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('currentStoreId').value;
            
            audits[id] = {
                colab: document.getElementById('editColab').value.toUpperCase(),
                ckoRegular: parseInt(document.getElementById('ckoRegular').value) || 0,
                ckoPapafila: parseInt(document.getElementById('ckoPapafila').value) || 0,
                ckoCnpj: parseInt(document.getElementById('ckoCnpj').value) || 0,
                retailQty: parseInt(document.getElementById('retailQty').value) || 0,
                totalCKO: calculateTotalCKO(),
                status: document.getElementById('auditStatus').value,
                date: document.getElementById('requestDate').value
            };
            
            saveData();
            renderStores();
            toggleModal('auditModal');
            showToast('✅ Auditoria salva com sucesso!');
        };

        function updateStats() {
            const total = stores.length;
            const resolvidos = Object.values(audits).filter(a => a.status === 'Resolvido').length;
            const pendentes = total - resolvidos;
            const divergencias = Object.values(audits).filter(a => a.totalCKO !== a.retailQty).length;

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statPendente').innerText = pendentes;
            document.getElementById('statResolvido').innerText = resolvidos;
            document.getElementById('statRegistros').innerText = divergencias;
        }

        function toggleModal(id) {
            const m = document.getElementById(id);
            m.classList.toggle('hidden');
            if (!m.classList.contains('hidden')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = 'auto';
            }
        }

        function confirmReset() {
            toggleModal('resetModal');
        }

        function executeReset() {
            localStorage.clear();
            loadData();
            updateStats();
            renderStores();
            toggleModal('resetModal');
            showToast('🗑️ Base de dados limpa!');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = '1';
            t.style.bottom = '32px';
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.bottom = '16px';
            }, 3000);
        }

        function exportToExcel() {
            if (Object.keys(audits).length === 0) {
                showToast('❌ Não há dados para exportar');
                return;
            }

            let csv = 'ID Loja;Unidade;Canal;Setor;Colaborador;Regular;Papa Fila;Informativo CNPJ;Total CKO;RetailX;Divergencia;Status;Data\n';
            
            stores.forEach(s => {
                const a = audits[s.id] || {};
                const div = a.totalCKO !== undefined ? a.totalCKO - a.retailQty : '';
                csv += [
                    s.id, s.name, s.canal, s.setor, a.colab || s.colab,
                    a.ckoRegular || 0, a.ckoPapafila || 0, a.ckoCnpj || 0,
                    a.totalCKO || 0, a.retailQty || 0, div, a.status || 'Pendente', a.date || ''
                ].join(';') + '\n';
            });

            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `Auditoria_CKO_${new Date().toLocaleDateString()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
